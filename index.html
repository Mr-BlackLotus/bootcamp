<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Pelatihan Sales Enter Komputer</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lembar kerja ala datasheet. Header, tab sticky, satu kolom konten (maks 980px), panel samping muncul di layar lebar. */
:root{
  color-scheme:dark;
  --bg:#09090B; --surface:#111114; --surface-2:#18181C; --ink:#F4F4F5; --ink-2:#A1A1AA; --line:#26262D; --line-2:#34343D;
  --accent:#7C9BFF; --accent-ink:#0A1030; --accent-soft:rgba(124,155,255,.14);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.13); --bad:#F87171; --bad-soft:rgba(248,113,113,.13); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);
  --f-display:'Inter','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{padding-block:28px 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.top h1{font-size:clamp(30px,6vw,46px);margin-top:8px}
.top .lead{max-width:62ch;color:var(--ink-2);margin-top:10px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:0 0 auto;padding:13px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:28px 72px}
.sec-h{font-size:24px;margin-bottom:6px}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.55}

/* home */
.hello{display:grid;gap:18px;grid-template-columns:1fr;margin-bottom:34px}
@media(min-width:720px){.hello{grid-template-columns:1fr 320px;align-items:end}}
.mods{border-top:2px solid var(--ink)}
.mod{display:grid;grid-template-columns:1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
@media(min-width:720px){.mod{grid-template-columns:1fr auto;align-items:center;gap:24px}}
.mod h3{font-size:22px}
.mod p{color:var(--ink-2);max-width:60ch;margin-top:4px}
.mod .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.rekap{margin-top:36px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
.tbl th{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tbl-scroll{overflow-x:auto}
.report{margin-top:16px;display:grid;gap:10px}
.report textarea{font-family:var(--f-mono);font-size:13px;min-height:260px}

/* progress */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.runhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}

/* choices */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
@media(max-width:480px){.panel{padding:16px}}
.qtext{font-family:var(--f-display);font-size:clamp(21px,3.4vw,26px);font-weight:600;line-height:1.3;margin:10px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;text-align:left;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;align-items:start}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;color:var(--ink-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.nextrow{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* setup */
.setup{display:grid;gap:22px;max-width:640px}
.choice-grid{display:grid;gap:8px}
.chip-opt{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;width:100%}
.chip-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:clamp(56px,14vw,88px);line-height:1;letter-spacing:-.02em}
.topic-bars{display:grid;gap:12px;margin:22px 0}
.tb{display:grid;grid-template-columns:minmax(0,200px) 1fr 56px;gap:12px;align-items:center;font-size:14px}
@media(max-width:560px){.tb{grid-template-columns:1fr 56px}.tb .bar{grid-column:1/-1;order:3}}
.tb .bar>i.low{background:var(--bad)}.tb .bar>i.hi{background:var(--ok)}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:10px}
details.rev summary{cursor:pointer;padding:12px 14px;font-weight:500;list-style:none;display:flex;gap:10px}
details.rev summary::-webkit-details-marker{display:none}
details.rev .inner{padding:0 14px 14px;display:grid;gap:8px}

/* essay */
.sumbar{display:flex;flex-wrap:wrap;gap:12px 28px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sumbar div{display:grid}
.sumbar b{font-family:var(--f-display);font-size:26px}
.grp{font-size:20px;margin:30px 0 10px}
details.essay{border-top:1px solid var(--line)}
details.essay:last-of-type{border-bottom:1px solid var(--line)}
details.essay>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;padding:14px 0;font-weight:500}
details.essay>summary::-webkit-details-marker{display:none}
details.essay>summary:hover .qt{text-decoration:underline;text-underline-offset:3px}
.essay-body{display:grid;gap:12px;padding:2px 0 22px}
.ctx{font-size:15px;color:var(--ink-2);padding:10px 12px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 6px 6px 0}
.pts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pts label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer}
.pts input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.src{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}

.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:14px}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.fchip .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
/* steps */
.picker{display:grid;gap:14px}
@media(min-width:720px){.picker{grid-template-columns:1fr 1fr}}
.track{display:grid;gap:10px;align-content:start;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.track h3{font-size:22px}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.rail li{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.rail li i{font-style:normal;font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.rail li span{display:none}
@media(min-width:760px){.rail li span{display:inline}}
.rail li.done{color:var(--ok);border-color:var(--ok)}
.rail li.done i{background:var(--ok);color:var(--surface)}
.rail li.cur{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rail li.cur span{display:inline}
.rail li.cur i{background:var(--accent);color:var(--accent-ink)}
.steps-grid{display:grid;gap:18px}
@media(min-width:900px){.steps-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.sheet{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.sheet h3{font-size:16px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sheet ol,.sheet ul{margin:0;padding:0;list-style:none}
.sheet li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;display:grid;gap:2px}
.sheet li:last-child{border-bottom:0}
.sheet li small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sheet .empty{padding:14px;color:var(--ink-2);font-size:14px}
.cust{padding:12px 14px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:6px;font-size:15px}
.cust b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-bottom:2px}
.tabs a[hidden]{display:none}
.adminlink{margin:40px 0 28px;font-size:13px;color:var(--ink-2)}
.adminlink a{color:var(--ink-2)}
.adminlink[hidden]{display:none}
.ad-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--surface)}
.ad-list{display:grid;gap:8px}
.ad-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-inline input[type=text]{flex:1 1 200px}
.ad-opt{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.ad-form{display:grid;gap:14px;padding-top:6px}
.ad-form .field{display:grid;gap:6px}
.ad-bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:6px 0 14px}
.ad-bar select{width:auto;min-width:240px;max-width:100%}
.ad-radio{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ad-radio input{width:20px;height:20px;accent-color:var(--accent)}
.ad-runs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.ad-runs li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.tbl td small{display:block;color:var(--ink-2);font-size:12px}
.tbl tr.sub td{background:var(--surface-2)}
.tries{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
/* ===== tema hitam profesional ===== */
html{scroll-behavior:smooth}
::selection{background:var(--accent);color:var(--accent-ink)}
body{background-image:radial-gradient(900px 420px at 15% -10%,rgba(124,155,255,.15),transparent 62%),radial-gradient(700px 340px at 95% 0%,rgba(52,211,153,.06),transparent 60%);background-repeat:no-repeat;font-feature-settings:"cv11","ss01"}
h1,h2,h3{letter-spacing:-.025em}
.top{padding-block:40px 30px;border-bottom:0}

.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8AA6FF,#4263EB);color:#fff;font:700 13px var(--f-display);letter-spacing:.02em;box-shadow:0 8px 24px rgba(66,99,235,.4)}
.top h1{font-size:clamp(32px,6vw,52px);margin-top:18px;font-weight:700}
.top h1 span{background:linear-gradient(90deg,#B4C4FF,#7C9BFF 55%,#6EE7B7);-webkit-background-clip:text;background-clip:text;color:transparent}

.eyebrow{font-size:12px}
.tabs{background:rgba(9,9,11,.8);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.tabs .wrap{gap:6px;padding-block:8px}
.tabs a{padding:8px 16px;border:0;border-radius:99px;font-size:15px;transition:background .15s,color .15s}
.tabs a:hover{background:var(--surface-2)}

.opt,.chip-opt{border-radius:12px;transition:border-color .15s,background .15s}

.fchip{background:var(--surface);transition:border-color .15s}

.pill{border:1px solid var(--line);background:var(--surface-2)}

.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:0;border:0;margin:6px 0 18px}
.sumbar div{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);gap:4px}

.tbl-scroll{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--surface)}

details.essay{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:10px;padding:0 16px}

<script>
/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- rekap helpers ---------- */
function essayStats() {
  let ans = 0, got = 0, tot = 0, rated = 0;
  ESSAYS.forEach(e => {
    if ((S.essay.a[e.id] || '').trim().length) ans++;
    if (S.essay.r[e.id]) { rated++; tot += e.pts.length; got += (S.essay.c[e.id] || []).filter(Boolean).length; }
  });
  return { ans, got, tot, rated, n: ESSAYS.length };
}
function buildReport() {
  const L = [], es = essayStats();
  L.push('LAPORAN PELATIHAN SALES ENTER KOMPUTER');
  L.push('Nama: ' + (S.name || '(belum diisi)'));
  L.push('Tanggal: ' + new Date().toLocaleString('id-ID'));
  L.push('');
  L.push('PILIHAN GANDA');
  if (S.mc.last) { const b = S.mc.last; L.push('Terakhir: ' + b.correct + '/' + b.n + ' (' + b.pct + '%), topik: ' + b.topicName); L.push('Terbaik: ' + S.mc.best.correct + '/' + S.mc.best.n + ' (' + S.mc.best.pct + '%)'); } else L.push('Belum dikerjakan');
  L.push('');
  L.push('STEP BY STEP');
  Object.keys(TRACKS).forEach(k => { const r = S.steps[k]; L.push(TRACKS[k].title + ': ' + (r ? r.score + '/' + r.total + ' benar di percobaan pertama' : 'belum dikerjakan')); });
  L.push('');
  L.push('ESAI (' + es.ans + ' dari ' + es.n + ' dijawab' + (es.tot ? ', penilaian mandiri ' + es.got + '/' + es.tot + ' poin' : '') + ')');
  ESSAYS.forEach(e => {
    const a = (S.essay.a[e.id] || '').trim(); if (!a) return;
    L.push(''); L.push('• ' + e.q); L.push(a);
    if (S.essay.r[e.id]) L.push('[Poin: ' + (S.essay.c[e.id] || []).filter(Boolean).length + '/' + e.pts.length + ']');
  });
  return L.join('\n');
}
