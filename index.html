<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Pelatihan Sales Enter Komputer</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: lembar kerja ala datasheet. Header, tab sticky, satu kolom konten (maks 980px), panel samping muncul di layar lebar. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E5EAE7; --ink:#101A16; --ink-2:#44524B; --line:#CAD3CD;
  --accent:#2447E0; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF;
  --ok:#16794A; --ok-soft:#DCF2E6; --bad:#B42318; --bad-soft:#FCE3E0; --warn:#8A5A00; --warn-soft:#FBEFD2;
  --f-display:'IBM Plex Sans Condensed','IBM Plex Sans','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#141D19; --surface-2:#1C2722; --ink:#E7EEEA; --ink-2:#9DABA3; --line:#2A3730;
    --accent:#93A8FF; --accent-ink:#0A122E; --accent-soft:#1A2347;
    --ok:#5ED394; --ok-soft:#10301F; --bad:#FF8F84; --bad-soft:#3A1613; --warn:#F0BC5A; --warn-soft:#33270C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#141D19; --surface-2:#1C2722; --ink:#E7EEEA; --ink-2:#9DABA3; --line:#2A3730;
  --accent:#93A8FF; --accent-ink:#0A122E; --accent-soft:#1A2347;
  --ok:#5ED394; --ok-soft:#10301F; --bad:#FF8F84; --bad-soft:#3A1613; --warn:#F0BC5A; --warn-soft:#33270C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{padding-block:28px 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.top h1{font-size:clamp(30px,6vw,46px);margin-top:8px}
.top .lead{max-width:62ch;color:var(--ink-2);margin-top:10px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:0 0 auto;padding:13px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:28px 72px}
.sec-h{font-size:24px;margin-bottom:6px}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.55}

/* home */
.hello{display:grid;gap:18px;grid-template-columns:1fr;margin-bottom:34px}
@media(min-width:720px){.hello{grid-template-columns:1fr 320px;align-items:end}}
.mods{border-top:2px solid var(--ink)}
.mod{display:grid;grid-template-columns:1fr;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
@media(min-width:720px){.mod{grid-template-columns:1fr auto;align-items:center;gap:24px}}
.mod h3{font-size:22px}
.mod p{color:var(--ink-2);max-width:60ch;margin-top:4px}
.mod .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.rekap{margin-top:36px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
.tbl th{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tbl-scroll{overflow-x:auto}
.report{margin-top:16px;display:grid;gap:10px}
.report textarea{font-family:var(--f-mono);font-size:13px;min-height:260px}

/* progress */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.runhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}

/* choices */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
@media(max-width:480px){.panel{padding:16px}}
.qtext{font-family:var(--f-display);font-size:clamp(21px,3.4vw,26px);font-weight:600;line-height:1.3;margin:10px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;text-align:left;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;align-items:start}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;color:var(--ink-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.6}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.nextrow{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* setup */
.setup{display:grid;gap:22px;max-width:640px}
.choice-grid{display:grid;gap:8px}
.chip-opt{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;width:100%}
.chip-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:clamp(56px,14vw,88px);line-height:1;letter-spacing:-.02em}
.topic-bars{display:grid;gap:12px;margin:22px 0}
.tb{display:grid;grid-template-columns:minmax(0,200px) 1fr 56px;gap:12px;align-items:center;font-size:14px}
@media(max-width:560px){.tb{grid-template-columns:1fr 56px}.tb .bar{grid-column:1/-1;order:3}}
.tb .bar>i.low{background:var(--bad)}.tb .bar>i.hi{background:var(--ok)}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:10px}
details.rev summary{cursor:pointer;padding:12px 14px;font-weight:500;list-style:none;display:flex;gap:10px}
details.rev summary::-webkit-details-marker{display:none}
details.rev .inner{padding:0 14px 14px;display:grid;gap:8px}

/* essay */
.sumbar{display:flex;flex-wrap:wrap;gap:12px 28px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sumbar div{display:grid}
.sumbar b{font-family:var(--f-display);font-size:26px}
.grp{font-size:20px;margin:30px 0 10px}
details.essay{border-top:1px solid var(--line)}
details.essay:last-of-type{border-bottom:1px solid var(--line)}
details.essay>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;padding:14px 0;font-weight:500}
details.essay>summary::-webkit-details-marker{display:none}
details.essay>summary:hover .qt{text-decoration:underline;text-underline-offset:3px}
.essay-body{display:grid;gap:12px;padding:2px 0 22px}
.ctx{font-size:15px;color:var(--ink-2);padding:10px 12px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 6px 6px 0}
.pts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pts label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer}
.pts input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.src{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}

/* steps */
.picker{display:grid;gap:14px}
@media(min-width:720px){.picker{grid-template-columns:1fr 1fr}}
.track{display:grid;gap:10px;align-content:start;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.track h3{font-size:22px}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.rail li{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.rail li i{font-style:normal;font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.rail li span{display:none}
@media(min-width:760px){.rail li span{display:inline}}
.rail li.done{color:var(--ok);border-color:var(--ok)}
.rail li.done i{background:var(--ok);color:var(--surface)}
.rail li.cur{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rail li.cur span{display:inline}
.rail li.cur i{background:var(--accent);color:var(--accent-ink)}
.steps-grid{display:grid;gap:18px}
@media(min-width:900px){.steps-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.sheet{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.sheet h3{font-size:16px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sheet ol,.sheet ul{margin:0;padding:0;list-style:none}
.sheet li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;display:grid;gap:2px}
.sheet li:last-child{border-bottom:0}
.sheet li small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sheet .empty{padding:14px;color:var(--ink-2);font-size:14px}
.cust{padding:12px 14px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:6px;font-size:15px}
.cust b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-bottom:2px}
.tries{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  ['sop', 'Divisi mana yang mengurus pembayaran, DP, revisi nota, retur barang, dan refund?', 'Kasir', ['Gudang', 'Teknik', 'MarKom'], 'Koordinasi dengan Divisi Kasir: pembayaran, DP, revisi nota, retur barang, dan refund.'],
  ['sop', 'Sales perlu mengecek warna atau stok unit barang ready stock. Ke divisi mana ia berkoordinasi?', 'Gudang', ['Pickup', 'Kasir', 'Update'], 'Divisi Gudang untuk pengecekan warna/stok unit atau keperluan lain terkait barang ready stock. Divisi Pickup untuk pengambilan barang oleh pelanggan atau pengiriman mandiri.'],
  ['sop', 'Pengiriman barang dari toko ke alamat pelanggan dikoordinasikan dengan...', 'Divisi Packing & Driver Kurir Toko', ['Divisi Pickup', 'Divisi Teknik', 'Divisi MarKom'], 'Divisi Packing & Driver Kurir Toko menangani pengiriman dari toko ke alamat pelanggan.'],
  ['sop', 'Info terbaru soal stok, harga, diskon, dan promo disampaikan agar informasi ke pelanggan selalu akurat. Siapa yang berkoordinasi dengan sales untuk ini?', 'Divisi Update', ['Divisi MarKom', 'Divisi Kasir', 'Divisi Teknik'], 'Divisi Update menyampaikan info terbaru. Divisi MarKom khusus untuk promo atau event seperti launching produk atau bundling.'],
  ['sop', 'Apa arti larangan transaksi pribadi dalam SOP sales?', 'Dilarang bertransaksi tanpa nota resmi atau menjual barang tidak legal, misalnya software bajakan atau lisensi ilegal', ['Dilarang memberi penjelasan garansi', 'Dilarang bertanya budget pelanggan', 'Dilarang membuat nota pembelian'], 'SOP bagian Lain-lain: transaksi harus memakai nota resmi, dan menjual barang ilegal dilarang.'],
  ['sop', 'Sales mengalami kendala dalam proses transaksi atau menghadapi pelanggan yang sulit. Sebaiknya...', 'Mencari bantuan supervisor', ['Menyelesaikan diam-diam sendiri', 'Meminta pelanggan pulang', 'Membatalkan transaksi'], 'SOP: cari bantuan supervisor jika mengalami kendala dalam proses transaksi atau pelanggan.'],
  ['sop', 'Informasi stok dan harga untuk PC Ready harus diberikan...', 'Secara real-time', ['Berdasarkan data kemarin', 'Hanya jika pelanggan bertanya dua kali', 'Setelah pembayaran'], 'SOP nomor 8: berikan info real-time terkait stok dan harga, khususnya untuk PC Ready.'],

  ['faq', 'Apa syarat pembuatan Faktur Pajak di Enter Komputer?', 'Memiliki NPWP perusahaan, dan nama perusahaan di nota sesuai NPWP', ['Cukup menunjukkan KTP pembeli', 'Tersedia untuk WNA dan perorangan', 'Pembayaran harus tunai atas nama pribadi'], 'Faktur Pajak: wajib NPWP perusahaan, nama di nota sesuai NPWP, pembayaran lewat rekening perusahaan (transfer ke CV Teman Baik) atau tunai. Tidak berlaku untuk WNA atau perorangan.'],
  ['faq', 'Estimasi maksimal penerbitan Faktur Pajak adalah...', '14 hari kerja', ['3 hari kerja', '7 x 24 jam', '30 hari kerja'], 'Estimasi penerbitan Faktur Pajak maksimal 14 hari kerja.'],
  ['faq', 'Semua barang yang dibeli bergaransi resmi, kecuali...', 'Aksesoris bonus seperti fan bawaan casing gratis', ['Processor', 'SSD', 'Motherboard'], 'Semua komponen memiliki garansi resmi, kecuali aksesoris bonus seperti fan bawaan casing gratis.'],
  ['faq', 'Klaim garansi dapat ditolak jika...', 'Segel rusak atau ada kerusakan fisik akibat pemakaian', ['Barang dibeli secara online', 'Barang sudah pernah dipakai', 'Pelanggan datang ke Customer Care'], 'Klaim dibawa ke Customer Care dan harus sesuai nota pembelian Enter Komputer (offline atau online). Klaim bisa ditolak jika segel rusak atau ada kerusakan fisik.'],
  ['faq', 'Pelanggan ingin mengambil barang di hari yang berbeda dari hari pembelian. Batas maksimalnya...', '7 x 24 jam setelah pembelian', ['1 x 24 jam', '3 x 24 jam', '30 hari'], 'Pengambilan barang di hari berbeda boleh, maksimal 7 x 24 jam setelah pembelian. Angka 3 x 24 jam adalah batas pengajuan tukar barang.'],
  ['faq', 'Barang pada dasarnya tidak bisa ditukar atau dikembalikan. Pengecualiannya adalah...', 'Barang berbeda dari nota, diajukan maksimal 3 x 24 jam, kondisi baik, segel utuh, kelengkapan lengkap', ['Pelanggan merasa kurang puas', 'Dalam 14 hari tanpa syarat', 'Hanya jika pelanggan membawa kardus tambahan'], 'Semua syarat harus terpenuhi: barang berbeda dari nota, pengajuan maksimal 3 x 24 jam, kondisi baik dengan segel utuh dan kelengkapan lengkap.'],
  ['faq', 'Pelanggan ingin merakit PC dengan membawa sebagian komponen dari luar. Syaratnya...', 'Membeli minimal 4 komponen utama di Enter Komputer', ['Membeli minimal 1 komponen', 'Tidak diperbolehkan sama sekali', 'Membayar biaya perakitan tambahan'], 'Contoh dari modul: membawa RAM, SSD, dan CPU Cooler dari luar, sisanya dibeli di Enter Komputer.'],
  ['faq', 'Komponen yang bukan dibeli di Enter Komputer akan dipasangkan. Pelanggan wajib...', 'Mengisi Formulir Perakitan dan menyetujui syarat & ketentuan', ['Membayar biaya perakitan', 'Menandatangani surat garansi baru', 'Tidak ada kewajiban apa pun'], 'Pemasangan komponen non-garansi tetap bisa, tetapi pelanggan harus diberi tahu bahwa risiko kerusakan di luar tanggung jawab Enter Komputer.'],
  ['faq', 'Berapa biaya pemasangan atau perakitan di Enter Komputer?', 'Gratis', ['Rp150.000', 'Rp50.000 per komponen', 'Tergantung jumlah komponen'], 'Pemasangan dan perakitan gratis. Rp150.000 adalah biaya kirim.'],
  ['faq', 'Layanan kirim barang Enter Komputer tersedia untuk wilayah dan biaya berapa?', 'Jabodetabek, Rp150.000 per kirim', ['Seluruh Indonesia, gratis', 'Jabodetabek, gratis', 'Pulau Jawa, Rp150.000 per kirim'], 'Kirim khusus Jabodetabek, Rp150.000 per kirim. Rakitan PC dikirim H+1 atau H+2 setelah perakitan selesai.'],
  ['faq', 'Pelanggan memasang sendiri komponen yang dibelinya. Apa yang harus disampaikan?', 'Kerusakan akibat pemasangan sendiri tidak dijamin garansi (garansi void)', ['Garansi tetap berlaku penuh', 'Pemasangan sendiri tidak diperbolehkan', 'Wajib memakai teknisi berbayar'], 'Boleh pasang sendiri, tetapi kerusakan akibat pemasangan sendiri tidak dijamin garansi.'],
  ['faq', 'Di mana offline store Enter Komputer?', 'Mangga Dua Mall dan BSD Serpong', ['Grand Indonesia dan Kelapa Gading', 'Mangga Dua Mall dan Bekasi', 'Glodok dan BSD Serpong'], 'Offline store: Mangga Dua Mall & BSD Serpong. Online lewat website, WhatsApp, email resmi, dan marketplace (Tokopedia, Shopee, Blibli, Akulaku).'],

  ['cpu', 'Huruf “F” pada prosesor Intel, misalnya Core i5-13400F, berarti...', 'Tanpa GPU internal, wajib memakai VGA terpisah', ['Bisa di-overclock', 'Edisi terbatas', 'Hemat daya dengan iGPU'], 'F = tanpa graphics internal. K = unlocked untuk overclock. KF = gabungan keduanya. KS = Special Edition.'],
  ['cpu', 'Huruf “K” pada prosesor Intel berarti...', 'Unlocked, bisa di-overclock (butuh pendingin yang sangat baik)', ['Tanpa GPU internal', 'Khusus laptop', 'Hemat daya'], 'K = unlocked atau bisa overclock. CPU “dipaksa” menghasilkan performa lebih tinggi dari setelan pabrik, sehingga butuh sistem pendingin yang baik.'],
  ['cpu', 'Pada Intel Core i9-13900K, angka “13” menunjukkan...', 'Generasi', ['Nomor model', 'Seri atau versi', 'Suffix'], 'Core i9 = seri, 13 = generasi, 900 = nomor model, K = suffix.'],
  ['cpu', 'Socket yang digunakan prosesor Intel generasi ke-12, 13, dan 14 adalah...', 'LGA 1700', ['LGA 1200', 'LGA 1151 v2', 'LGA 1851'], 'LGA 1200 untuk Gen 10 dan 11. LGA 1151 v2 untuk Gen 8 dan 9. LGA 1851 untuk Gen 15 (seri Ultra).'],
  ['cpu', 'Bagaimana hubungan LGA 1151 dan LGA 1151 v2?', 'Tidak kompatibel satu sama lain walau bentuknya serupa', ['Sepenuhnya kompatibel', 'Hanya berbeda warna', 'LGA 1151 v2 untuk Gen 6 dan 7'], 'LGA 1151 untuk Gen 6 dan 7. LGA 1151 v2 untuk Gen 8 dan 9. Keduanya tidak saling kompatibel.'],
  ['cpu', 'Socket AMD terbaru yang mendukung DDR5 dan PCIe 5.0 untuk Ryzen 7000 series ke atas adalah...', 'AM5', ['AM4', 'LGA 1700', 'LGA 1851'], 'AM4 dipakai Ryzen generasi 1 sampai 5. AM5 mulai Ryzen 7000 (Zen 4).'],
  ['cpu', 'Suffix “X3D” pada prosesor AMD Ryzen berarti...', 'Varian dengan 3D V-Cache, dirancang khusus untuk gaming', ['Tanpa GPU internal', 'Hemat daya dengan iGPU', 'Edisi terbatas'], 'X = performa lebih tinggi. X3D = cache tambahan (3D V-Cache) untuk performa gaming optimal.'],
  ['cpu', 'Prosesor AMD berakhiran “G”, misalnya Ryzen 5 5600G, memiliki...', 'GPU bawaan (iGPU), cocok dipakai tanpa VGA terpisah', ['Tidak ada GPU bawaan', 'Kemampuan overclock tanpa batas', 'Socket khusus laptop'], 'F = tanpa iGPU. G = punya iGPU. GE = varian hemat daya dari G.'],
  ['cpu', 'Pelanggan hanya butuh PC untuk kantor, browsing, dan media ringan. Prosesor yang sesuai adalah...', 'Core i3 atau Ryzen 3', ['Core i9 atau Ryzen 9', 'Core i7 atau Ryzen 7', 'Core i9-14900KS'], 'i3/Ryzen 3 untuk kebutuhan dasar. i5/Ryzen 5 untuk gaming menengah dan edit video. i7/Ryzen 7 untuk game lanjut dan multitasking berat. i9/Ryzen 9 untuk kreator profesional.'],
  ['mb', 'Motherboard seri Intel H dan AMD A termasuk kelas...', 'Budget dengan fitur terbatas', ['Menengah ke atas', 'High end paling lengkap', 'Khusus server'], 'H dan A: budget (umumnya hanya 2 slot RAM, tanpa overclock). B: menengah atau tinggi. Z dan X: high end.'],
  ['mb', 'Motherboard high end dengan fitur paling lengkap (overclock CPU, lebih dari 2 slot NVMe, WiFi dan Bluetooth bawaan) adalah seri...', 'Intel Z atau AMD X', ['Intel H atau AMD A', 'Intel B atau AMD B', 'Intel H atau AMD X'], 'Seri Z dan X cocok untuk kegiatan berat atau prosesor seri tinggi, dengan harga relatif mahal.'],
  ['mb', 'Ciri motherboard seri B yang benar adalah...', 'Fitur lebih banyak dari seri H, mendukung overclock RAM, tetapi tidak overclock CPU', ['Mendukung overclock CPU seperti seri Z', 'Hanya tersedia ukuran ATX', 'Selalu memiliki 4 slot RAM'], 'Seri B tersedia dalam ukuran ITX, mATX, dan ATX. Jumlah slot RAM dan NVMe bergantung merek dan harga.'],
  ['mb', 'Ukuran motherboard yang paling kecil adalah...', 'Mini ITX', ['Micro ATX', 'ATX', 'E-ATX'], 'Mini ITX (6,7" x 6,7"), biasanya 2 slot RAM dan 1 slot PCIe, wajib casing khusus mini-ITX. E-ATX paling besar.'],
  ['mb', 'Motherboard yang cocok untuk prosesor Intel Gen 12 sampai 14 (LGA 1700) adalah...', 'B760M', ['B560M', 'B550M', 'B860M'], 'B560M memakai LGA 1200, B550M untuk AMD AM4, B860M untuk LGA 1851.'],
  ['mb', 'Apa fungsi chip BIOS/UEFI pada motherboard?', 'Menyimpan firmware dasar untuk proses booting dan konfigurasi awal', ['Mendinginkan chipset', 'Menyalurkan daya dari PSU', 'Menyimpan data pengguna'], 'BIOS lebih sederhana, UEFI lebih modern dan mendukung antarmuka grafis.'],

  ['ram', 'Apa fungsi utama RAM?', 'Menyimpan data sementara yang sedang diproses CPU', ['Menyimpan data secara permanen', 'Mengubah listrik AC menjadi DC', 'Memproses grafis'], 'Data permanen disimpan di storage (SSD/HDD). RAM menentukan kecepatan membuka program, file, dan multitasking.'],
  ['ram', 'RAM untuk laptop dan untuk desktop masing-masing berjenis...', 'SO-DIMM untuk laptop, Long-DIMM untuk desktop', ['Long-DIMM untuk laptop, SO-DIMM untuk desktop', 'DDR untuk laptop, DIMM untuk desktop', 'Keduanya sama'], 'SO-DIMM berukuran lebih kecil untuk perangkat portabel. Long-DIMM berukuran lebih besar untuk desktop.'],
  ['ram', 'Rekomendasi kapasitas RAM dalam ringkasan modul adalah...', '8GB cukup untuk basic, 16 sampai 32GB untuk gaming atau desain', ['4GB untuk gaming', '64GB wajib untuk semua PC', '8GB untuk rendering 3D profesional'], 'Generasi RAM (DDR3, DDR4, DDR5) juga harus cocok dengan prosesor dan motherboard. Dual Channel lebih cepat daripada Single Channel.'],
  ['ssd', 'Kombinasi storage yang paling baik untuk performa dan kapasitas adalah...', 'SSD untuk OS dan aplikasi, HDD untuk data besar', ['HDD saja', 'SSD kecil saja', 'Dua HDD'], 'SSD cepat dan responsif. HDD lebih murah untuk kapasitas besar.'],
  ['ssd', 'SSD lebih tahan guncangan daripada HDD karena...', 'Tidak memiliki bagian yang bergerak', ['Memakai piringan magnet', 'Ukurannya lebih besar', 'Memakai kipas pendingin'], 'HDD memakai piringan magnet sehingga rentan kerusakan fisik. SSD memakai memori non-volatile.'],
  ['ssd', 'Jenis SSD yang memakai slot M.2 dan jalur PCIe adalah...', 'NVMe', ['SATA SSD 2,5"', 'HDD', 'Kartu SD'], 'SATA SSD memakai konektor SATA seperti HDD, lebih cepat dari HDD tetapi lebih lambat dari NVMe.'],
  ['vga', 'Komponen PC yang paling banyak mengonsumsi daya adalah...', 'VGA card', ['RAM', 'SSD', 'Casing'], 'Karena itu VGA menjadi pertimbangan utama saat menghitung kebutuhan watt PSU.'],
  ['vga', 'Seri VGA NVIDIA yang membawa teknologi ray tracing adalah...', 'RTX', ['GT', 'GTX', 'GTS'], 'GT: entry level. GTX: mid sampai high end. RTX: teknologi terbaru dengan ray tracing.'],
  ['vga', 'VRAM yang disarankan modul untuk gaming 1080p adalah...', '6 sampai 8GB', ['2GB', '4GB', '24GB'], '4GB untuk penggunaan ringan, 6 sampai 8GB untuk gaming 1080p, 12GB ke atas untuk 4K dan profesional.'],
  ['psu', 'Apa fungsi utama PSU?', 'Mengubah listrik AC menjadi DC dan menstabilkan tegangan untuk komponen', ['Mendinginkan prosesor', 'Menyimpan data sementara', 'Mengolah grafis'], 'PSU juga punya proteksi arus lebih, tegangan tinggi atau rendah, dan anti korsleting.'],
  ['psu', 'Efisiensi minimal sertifikasi 80 PLUS Gold adalah...', '87 sampai 90%', ['80%', '82 sampai 85%', '94% ke atas'], 'White 80%, Bronze 82 sampai 85%, Silver 85 sampai 88%, Gold 87 sampai 90%, Platinum 90 sampai 92%, Titanium 94% ke atas.'],
  ['psu', 'Urutan sertifikasi 80 PLUS dari yang paling dasar sampai paling efisien adalah...', 'White, Bronze, Silver, Gold, Platinum, Titanium', ['Bronze, White, Silver, Gold, Titanium, Platinum', 'Titanium, Platinum, Gold, Silver, Bronze, White', 'White, Silver, Bronze, Gold, Platinum, Titanium'], 'Semakin tinggi efisiensi, semakin baik kualitasnya, tetapi harga juga lebih mahal.'],
  ['psu', 'PSU Semi-Modular berarti...', 'Hanya beberapa kabel penting yang terpasang permanen, sisanya bisa dilepas-pasang', ['Semua kabel terpasang permanen', 'Tidak ada kabel yang terpasang permanen', 'Khusus untuk casing Mini ITX'], 'Non-Modular: semua kabel permanen (paling murah). Full Modular: semua kabel bisa dilepas, paling rapi.'],
  ['psu', 'PSU untuk casing Mini ITX umumnya berukuran...', 'SFX atau SFX-L', ['ATX', 'E-ATX', 'Full Tower'], 'ATX (150 x 86 x 140 mm) cocok untuk casing Full ATX dan mATX. SFX-L dan SFX adalah versi kecil untuk casing Mini ITX.'],
  ['psu', 'Saran modul untuk memilih daya dan kualitas PSU adalah...', 'Hitung kebutuhan daya lalu tambah 20 sampai 30% untuk upgrade, minimal 80+ Bronze', ['Pilih PSU bawaan casing karena sudah cukup', 'Selalu pilih 1000W', 'Pilih PSU terkecil agar hemat'], 'PSU bawaan casing hanya cukup menyalakan komputer tanpa aliran listrik yang stabil, sehingga risiko kerusakan hardware lebih tinggi.'],
  ['mon', 'Resolusi Full HD adalah...', '1920 x 1080', ['1366 x 768', '2560 x 1440', '3840 x 2160'], 'HD 1366 x 768, QHD 2560 x 1440, 4K 3840 x 2160. Ukuran monitor diukur secara diagonal.'],
  ['mouse', 'Apa perbedaan mouse gaming dengan mouse casual?', 'Mouse gaming punya DPI tinggi, pengaturan khusus, dan tombol macro', ['Mouse casual punya pilihan DPI tinggi', 'Mouse gaming selalu wireless', 'Mouse gaming harganya lebih murah'], 'Mouse gaming harganya relatif lebih mahal dan umumnya memakai kabel USB untuk kestabilan.'],
  ['kb', 'Switch keyboard mechanical Cherry MX Brown dikenal sebagai tipe...', 'Tactile', ['Ringan (linear)', 'Berat', 'Cepat'], 'Cherry MX Red ringan. Black berat. Speed Silver cepat. Brown tactile.'],
  ['case', 'Casing yang paling umum digunakan, tinggi 40 sampai 50 cm, kompatibel dengan ATX, Micro-ATX, dan Mini-ITX adalah...', 'Mid Tower', ['Full Tower', 'Mini Tower', 'Slim Case'], 'Full Tower tinggi lebih dari 50 cm. Mini Tower 30 sampai 40 cm. Slim Case hemat tempat tetapi airflow terbatas.'],
  ['gen', 'Komponen minimal agar PC desktop dapat menyala dan digunakan adalah...', 'CPU, motherboard, RAM, storage, PSU, monitor, keyboard, mouse', ['CPU, RAM, dan casing saja', 'CPU, VGA, dan RAM', 'Motherboard, VGA, dan casing'], 'VGA opsional jika prosesor memiliki iGPU.'],
  ['gen', 'Secara umum, komputer bekerja dengan cara...', 'Menerima perintah (input), memproses data, dan menghasilkan hasil (output)', ['Hanya menyimpan data', 'Hanya menampilkan gambar', 'Menerima output lalu menghasilkan input'], 'Komputer adalah perangkat untuk membantu pekerjaan manusia sekaligus media hiburan atau multimedia.'],
  ['gen', 'Manakah daftar jenis komputer yang umum digunakan menurut modul?', 'Desktop PC, All-in-One PC, Notebook/Laptop, Tablet, Mini PC, Nano PC, Server', ['Hanya Desktop PC dan Laptop', 'Hanya Server', 'Hanya Tablet dan Smartphone'], 'Setiap jenis komputer punya kelebihan dan kekurangan sesuai kebutuhan pengguna.'],
  ['gen', 'Kepanjangan CPU dan GPU adalah...', 'Central Processing Unit dan Graphics Processing Unit', ['Central Power Unit dan General Processing Unit', 'Computer Processing Unit dan Graphic Power Unit', 'Central Program Unit dan Graphic Program Unit'], 'CPU adalah otak komputer yang memproses perintah. GPU memproses grafis.'],
  ['gen', 'Apa perbedaan Software dan Hardware?', 'Software adalah instruksi digital tak berwujud, hardware adalah komponen fisik yang dapat disentuh', ['Software adalah komponen fisik, hardware adalah program', 'Keduanya sama-sama dapat disentuh', 'Software hanya monitor dan keyboard'], 'Contoh hardware: monitor dan keyboard. Software mengatur cara kerja hardware.'],
  ['ram', 'Generasi RAM yang paling baru, lebih cepat, dan lebih hemat daya adalah...', 'DDR5', ['DDR3', 'DDR4', 'DDR2'], 'DDR3 masih dipakai pada beberapa PC atau laptop, DDR4 paling umum, DDR5 terbaru. Setiap generasi hanya cocok dengan prosesor dan motherboard tertentu.'],
  ['ram', 'RAM bertuliskan DDR4-3200 memiliki kecepatan...', '3200MHz', ['1600MHz', '4000MHz', '6000MHz'], 'Satuan kecepatan RAM adalah MHz. Kecepatan lebih tinggi meningkatkan performa, tetapi pastikan kompatibel dengan prosesor dan motherboard.'],
  ['case', 'Casing Full Tower memiliki ciri...', 'Tinggi lebih dari 50 cm dan kompatibel dengan semua tipe motherboard', ['Tinggi 30 sampai 40 cm dan hanya untuk Mini-ITX', 'Selalu sudah termasuk PSU berkualitas tinggi', 'Hanya cocok untuk motherboard ATX'], 'Full Tower cocok untuk PC dengan banyak komponen, custom liquid cooling, dan airflow luas. Umumnya tanpa PSU bawaan.'],
  ['case', 'Casing Mini Tower (30 sampai 40 cm) kompatibel dengan motherboard...', 'Micro-ATX dan Mini-ITX', ['ATX dan E-ATX', 'Hanya E-ATX', 'Semua tipe termasuk XL-ATX'], 'Mini Tower berukuran ringkas dan cocok untuk PC sederhana.'],
  ['case', 'Apa fungsi utama casing PC?', 'Melindungi komponen dari debu, kotoran, dan benturan, serta menjaga airflow agar suhu stabil', ['Mengubah listrik AC menjadi DC', 'Menyimpan data sementara', 'Mengolah grafis'], 'Casing juga memudahkan penataan dan pemasangan komponen.'],
  ['case', 'Bagaimana kualitas PSU bawaan pada casing Mid Tower?', 'Beberapa sudah dilengkapi PSU, tetapi kualitas PSU bawaan biasanya rendah', ['Selalu berkualitas tinggi', 'Tidak pernah ada', 'Selalu bersertifikasi Titanium'], 'Karena itu PSU bawaan casing sebaiknya diganti PSU berkualitas dengan sertifikasi efisiensi.'],
  ['ssd', 'Ukuran M.2 2280 berarti...', '22 mm x 80 mm', ['28 mm x 80 mm', '2,5 inci', '22 mm x 28 mm'], 'M.2 2280 cocok untuk laptop atau PC modern. NVMe memiliki lebar 22 mm dengan panjang bervariasi.'],
  ['ssd', 'Urutan kecepatan penyimpanan dari yang paling lambat ke paling cepat adalah...', 'HDD, SATA SSD, NVMe', ['NVMe, SATA SSD, HDD', 'SATA SSD, HDD, NVMe', 'HDD, NVMe, SATA SSD'], 'SATA SSD (hingga 6 Gbps) lebih cepat dari HDD tetapi lebih lambat dari NVMe yang memakai jalur PCIe.'],
  ['hdd', 'HDD menyimpan data menggunakan...', 'Piringan magnet', ['Memori non-volatile tanpa bagian bergerak', 'Chip RAM', 'Kartu SD'], 'Karena ada bagian bergerak, HDD rentan kerusakan fisik saat terguncang.'],
  ['hdd', 'Kelebihan utama HDD dibanding SSD adalah...', 'Kapasitas besar dengan harga lebih murah', ['Booting jauh lebih cepat', 'Lebih tahan guncangan', 'Tidak ada bagian bergerak'], 'Kapasitas HDD umumnya 500GB sampai 10TB. Modul mencontohkan 1TB HDD sekitar Rp890 ribu dan SSD sekitar Rp1,7 juta (harga contoh, bisa berubah).'],
  ['hdd', 'HDD paling cocok digunakan untuk...', 'Penyimpanan data besar dengan biaya lebih hemat', ['Menjalankan sistem operasi agar cepat', 'Memproses grafis', 'Menggantikan RAM'], 'SSD untuk sistem operasi dan aplikasi utama. HDD untuk data besar.'],

            const arr = (S.essay.c[e.id] || []).slice(); while (arr.length < e.pts.length) arr.push(false); arr[k] = ev.target.checked; S.essay.c[e.id] = arr; persist(); setChip(); paintSum();
          } }), h('span', { text: p }))))),
          h('p', { class: 'src', style: 'margin-top:10px', text: 'Rujukan modul: ' + e.src }));
      }
      if (S.essay.r[e.id]) { paintRev(); btn.hidden = true; }
      upd();
      const body = h('div', { class: 'essay-body' }, e.ctx ? h('p', { class: 'ctx', text: e.ctx }) : null, ta, h('div', { class: 'btn-row', style: 'align-items:center' }, btn, count), rev);
      const d = h('details', { class: 'essay' }, h('summary', {}, h('span', { class: 'qt', text: e.q }), chip), body);
      if (first) { d.open = true; first = false; }

  });
  return root;
}

/* ---------- STEP BY STEP ---------- */
function viewSteps() {
  if (!st) return stepPicker();
  const T = TRACKS[st.id];
  if (st.done) return stepDone(T);
  return stepRun(T);
}
function stepPicker() {
  return h('div', {}, h('h2', { class: 'sec-h', text: 'Step by Step' }),
    h('p', { class: 'muted', style: 'max-width:64ch;margin-bottom:18px', text: 'Kamu harus memilih jawaban yang benar sebelum bisa lanjut. Skor dihitung dari langkah yang benar di percobaan pertama.' }),
    h('div', { class: 'picker' }, Object.entries(TRACKS).map(([id, T]) => h('div', { class: 'track' },
      h('h3', { text: T.title }), h('p', { class: 'muted', text: T.desc }),
      h('div', { class: 'meta', style: 'display:flex;gap:8px;flex-wrap:wrap' }, h('span', { class: 'pill', text: T.steps.length + ' langkah' }), S.steps[id] ? h('span', { class: 'pill ok', text: 'Terakhir ' + S.steps[id].score + '/' + S.steps[id].total }) : h('span', { class: 'pill', text: 'Belum dikerjakan' })),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', onclick: () => startTrack(id) }, S.steps[id] ? 'Ulangi' : 'Mulai'))))));
}
function startTrack(id) {
  const T = TRACKS[id];
  st = { id, i: 0, tries: 0, wrong: [], answered: false, firstTry: [], done: false, order: T.steps.map(s => shuffle(s.opts.map((_, k) => k))) };
  render(); window.scrollTo(0, 0);
}
function stepRun(T) {
  const s = T.steps[st.i], n = T.steps.length;
  const rail = h('ol', { class: 'rail', 'aria-label': 'Daftar langkah' }, T.steps.map((x, k) => h('li', { class: k < st.i || (k === st.i && st.answered) ? 'done' : k === st.i ? 'cur' : '' }, h('i', { text: k < st.i || (k === st.i && st.answered) ? '✓' : String(k + 1) }), h('span', { text: x.name }))));
  const fb = h('div', { class: 'fb', hidden: true, role: 'status' });
  const tries = h('span', { class: 'tries' });
  const next = h('button', { class: 'btn primary', hidden: true, onclick: () => {
    if (st.i === n - 1) { st.done = true; const sc = st.firstTry.filter(Boolean).length; S.steps[st.id] = { score: sc, total: n, at: Date.now() }; persist(); }
    else { st.i++; st.tries = 0; st.wrong = []; st.answered = false; }
    render(); window.scrollTo(0, 0);
  } }, st.i === n - 1 ? 'Selesai, lihat hasil' : 'Langkah berikutnya');
  const btns = st.order[st.i].map((k, pos) => {
    const o = s.opts[k];
    return h('button', { class: 'opt', onclick: () => choose(k, btn), 'data-k': k }, h('span', { class: 'k', text: LET[pos] }), h('span', { text: o.t }));
  });
  let btn = null;
  function choose(k, b) {
    if (st.answered) return;
    const o = s.opts[k], el = btns.find(x => Number(x.dataset.k) === k);
    if (o.ok) {
      st.answered = true; st.firstTry[st.i] = st.tries === 0;
      btns.forEach(x => { x.disabled = true; if (Number(x.dataset.k) === k) x.classList.add('ok'); else if (!st.wrong.includes(Number(x.dataset.k))) x.classList.add('dim'); });
      fb.className = 'fb ok'; fb.hidden = false; fb.replaceChildren(h('strong', { text: st.tries === 0 ? 'Tepat.' : 'Benar, setelah ' + (st.tries + 1) + ' percobaan.' }), o.why);
      next.hidden = false; next.focus();
      rail.children[st.i].className = 'done'; rail.children[st.i].firstChild.textContent = '✓';
      paintSide();
    } else {
      st.tries++; st.wrong.push(k); el.classList.add('bad'); el.disabled = true;
      fb.className = 'fb bad'; fb.hidden = false; fb.replaceChildren(h('strong', { text: 'Belum tepat. Coba pilihan lain.' }), o.why);
      tries.textContent = 'Percobaan salah: ' + st.tries;
    }
  }
  if (st.tries) tries.textContent = 'Percobaan salah: ' + st.tries;
  const side = h('aside', { class: 'sheet', 'aria-label': T.sheet });
  function paintSide() {
    const kept = T.steps.slice(0, st.i + (st.answered ? 1 : 0));
    side.replaceChildren(h('h3', { text: T.sheet }), kept.length ?
      h('ul', {}, kept.map(x => h('li', {}, h('small', { text: x.label || x.name }), h('span', { text: x.keep })))) :
      h('p', { class: 'empty', text: st.id === 'B' ? 'Komponen yang kamu pilih akan tercatat di sini.' : 'Kalimat sales yang tepat akan tercatat di sini.' }));
  }
  paintSide();
  const main = h('div', { class: 'panel' },
    h('div', { class: 'runhead' }, h('span', { class: 'label', text: 'Langkah ' + (st.i + 1) + ' dari ' + n + ' · ' + s.name }), tries),
    st.i === 0 ? h('p', { class: 'ctx', style: 'margin-bottom:12px', text: T.intro }) : null,
    s.ctx ? h('p', { class: 'ctx', style: 'margin-bottom:12px', text: s.ctx }) : null,
    s.cust ? h('div', { class: 'cust' }, h('b', { text: 'Pelanggan' }), '“' + s.cust + '”') : null,
    h('p', { class: 'qtext', text: s.q }), h('div', { class: 'opts' }, btns), fb,
    h('div', { class: 'nextrow' }, h('button', { class: 'btn sm', onclick: () => { st = null; render(); } }, 'Keluar dari jalur ini'), next));
  if (st.answered) { /* tidak terjadi: render ulang selalu pada langkah baru */ }
  return h('div', {}, h('h2', { class: 'sec-h', style: 'margin-bottom:14px', text: T.title }), rail, h('div', { class: 'steps-grid' }, main, side));
}
function stepDone(T) {
  const n = T.steps.length, sc = st.firstTry.filter(Boolean).length;
  return h('div', {},
    h('p', { class: 'label', text: 'Selesai · ' + T.title }),
    h('div', { class: 'score' }, h('b', { text: sc + '/' + n }), h('span', { class: 'muted', text: 'langkah benar di percobaan pertama' })),
    h('div', { class: 'steps-grid', style: 'margin-top:22px' },
      h('div', {}, h('h2', { class: 'grp', style: 'margin-top:0', text: 'Ringkasan tiap langkah' }),
        T.steps.map((s, k) => h('details', { class: 'rev' }, h('summary', {}, h('span', { class: 'pill ' + (st.firstTry[k] ? 'ok' : 'bad'), text: st.firstTry[k] ? 'Langsung benar' : 'Perlu mengulang' }), h('span', { text: (k + 1) + '. ' + s.name })),
          h('div', { class: 'inner' }, h('p', { class: 'muted', text: s.q }), h('p', {}, h('b', { text: 'Jawaban tepat: ' }), s.opts.find(o => o.ok).t), h('p', { class: 'muted', text: s.opts.find(o => o.ok).why }))))),
      h('aside', { class: 'sheet' }, h('h3', { text: T.sheet + ' (lengkap)' }), h('ul', {}, T.steps.map(x => h('li', {}, h('small', { text: x.label || x.name }), h('span', { text: x.keep })))))),
    h('div', { class: 'btn-row', style: 'margin-top:22px' }, h('button', { class: 'btn primary', onclick: () => startTrack(st.id) }, 'Ulangi jalur ini'), h('button', { class: 'btn', onclick: () => { st = null; render(); } }, 'Pilih jalur lain'), h('button', { class: 'btn', onclick: () => go('home') }, 'Kembali ke beranda')));
}

render();
</script>
